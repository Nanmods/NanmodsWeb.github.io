<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanmods的网页解密游戏(测试版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background-color: #1c1c1e;
            /* 深色绿色渐变背景 */
            background-image: radial-gradient(circle at top left, rgba(16, 185, 129, 0.32), transparent 35%),
                              radial-gradient(circle at bottom right, rgba(5, 150, 105, 0.25), transparent 35%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 左上角登录注册按钮容器 */
        .header-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            display:flex;
            gap:10px;
        }
        .login-btn {
            padding: 8px 16px;
            background-color:#10b981;
            color: #ffffff;
            border: 1px solid rgba(160, 255, 210, 0.65);
            border-radius: 8px;
            font-size:15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.22);
        }
        .login-btn:hover {
            background-color:#059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(190, 255, 230, 0.75);
        }
        .login-btn:active {
            background-color:#047857;
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.18);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(130, 210, 180, 0.55);
        }
        .register-btn {
            padding: 8px 16px;
            background-color: rgba(44,44,46,0.75);
            color: #ffffff;
            border: 1px solid rgba(180, 220, 255, 0.45);
            border-radius: 8px;
            font-size:15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
        }
        .register-btn:hover {
            background-color: rgba(60,60,62,0.8);
            transform: translateY(-1px);
        }
        .register-btn:active {
            transform: translateY(0);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%);
        }
        /*卡片上方标题：放大字体，加大和卡片间距*/
        .page-title{
            font-size:34px;
            font-weight:700;
            color:#ffffff;
            margin-bottom:36px;
            text-align:center;
        }
        .card {
            background: rgba(44,44,46,0.75);
            backdrop-filter: blur(12px);
            padding: 44px 36px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            max-width: 620px;
            width: 100%;
        }
        /* 搜索区域 */
        .search-wrap{
            margin-bottom:12px;
            display:flex;
            gap:12px;
        }
        .tip-text{
            font-size:14px;
            color:rgba(255,255,255,0.55);
            margin-bottom:32px;
            text-align:center;
        }
        .search-input{
            flex:1;
            padding:12px 20px;
            font-size:16px;
            background-color: #2c2c2e;
            color:#ffffff;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:999px;
            outline:none;
            font-family: "Segoe UI", system-ui, sans-serif;
            transition: border-color 150ms cubic-bezier(0, 0, 0.2, 1);
        }
        .search-input::placeholder{
            color:rgba(255,255,255,0.45);
        }
        .search-input:focus{
            border-color:#10b981;
        }
        /* 圆形搜索按钮，绿色主按钮风格 */
        .search-btn{
            width:48px;
            height:48px;
            padding:0;
            background-color:#10b981;
            color:#ffffff;
            border: 1px solid rgba(160, 255, 210, 0.65);
            border-radius:50%;
            font-size:20px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.22);
            /* iOS风格顶部高光渐变 */
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            will-change: transform;
            backface-visibility: hidden;
        }
        .search-btn:hover{
            background-color:#059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(190, 255, 230, 0.75);
        }
        .search-btn:active{
            background-color:#047857;
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.18);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(130, 210, 180, 0.55);
            transition-duration: 80ms;
        }
        /* 可点击文字链接 深色模式 */
        .text-link {
            display: inline-block;
            margin-top: 16px;
            color: #10b981;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
            transition: color 150ms cubic-bezier(0, 0, 0.2, 1);
        }
        .text-link:hover {
            color: #34d399;
        }
    </style>
</head>
<body>
    <!-- 左上角：登录（绿色主按钮）+ 注册（次要毛玻璃按钮） -->
    <div class="header-bar">
        <button class="login-btn">登录</button>
        <button class="register-btn">注册</button>
    </div>

    <h1 class="page-title">Nanmods的网页解密游戏(测试版)</h1>

    <div class="card">
        <div class="search-wrap">
            <input class="search-input" type="text" placeholder="请输入搜索内容">
            <button class="search-btn">🔍</button>
        </div>
        <div class="tip-text">已经被归档的文件无法查看</div>
        <a class="text-link" href="https://space.bilibili.com/1321022362?spm_id_from=333.1007.0.0" target="_blank">关于作者</a>
    </div>
</body>
</html>
