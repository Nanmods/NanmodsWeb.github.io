<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NothingExplore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background-color: #1c1c1e;
            background-image: radial-gradient(circle at top left, rgba(16, 185, 129, 0.32), transparent 35%),
                              radial-gradient(circle at bottom right, rgba(5, 150, 105, 0.25), transparent 35%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            display:flex;
            gap:10px;
        }
        .login-btn {
            padding: 8px 16px;
            background-color:#10b981;
            color: #ffffff;
            border: 1px solid rgba(160, 255, 210, 0.65);
            border-radius: 8px;
            font-size:15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.22);
        }
        .login-btn:hover {
            background-color:#059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(190, 255, 230, 0.75);
        }
        .login-btn:active {
            background-color:#047857;
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.18);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(130, 210, 180, 0.55);
        }
        .logout-btn {
            padding: 8px 16px;
            background-color:#ef4444;
            color: #ffffff;
            border: 1px solid rgba(255,160,160,0.65);
            border-radius: 8px;
            font-size:15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            display:none;
        }
        .logout-btn:hover {
            background-color:#dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.32);
        }
        .logout-btn:active {
            background-color:#b91c1c;
            transform: translateY(0);
        }
        .register-btn {
            padding: 8px 16px;
            background-color: rgba(44,44,46,0.75);
            color: #ffffff;
            border: 1px solid rgba(180, 220, 255, 0.45);
            border-radius: 8px;
            font-size:15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
        }
        .register-btn:hover {
            background-color: rgba(60,60,62,0.8);
            transform: translateY(-1px);
        }
        .register-btn:active {
            transform: translateY(0);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%);
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(30,30,32,0.92);
            color:#ffb86c;
            padding:12px 24px;
            border-radius:8px;
            border:1px solid rgba(255,184,108,0.4);
            backdrop-filter: blur(10px);
            font-size:15px;
            z-index:999;
            display:none;
        }
        .toast.error{
            color:#ff7878;
            border-color:rgba(255,120,120,0.4);
        }
        .toast.success{
            color:#4ade80;
            border-color:rgba(74,222,128,0.4);
        }
        .page-title{
            font-size:34px;
            font-weight:700;
            color:#ffffff;
            margin-bottom:36px;
            text-align:center;
        }
        .card {
            background: rgba(44,44,46,0.75);
            backdrop-filter: blur(12px);
            padding: 44px 36px;
            border-radius:16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            max-width: 620px;
            width: 100%;
        }
        .search-wrap{
            margin-bottom:12px;
            display:flex;
            gap:12px;
        }
        .tip-text{
            font-size:14px;
            color:rgba(255,255,255,0.55);
            margin-bottom:32px;
            text-align:center;
        }
        .search-input{
            flex:1;
            padding:12px 20px;
            font-size:16px;
            background-color: #2c2c2e;
            color:#ffffff;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:999px;
            outline:none;
            font-family: "Segoe UI", system-ui, sans-serif;
            transition: border-color 150ms cubic-bezier(0, 0, 0.2, 1);
        }
        .search-input::placeholder{
            color:rgba(255,255,255,0.45);
        }
        .search-input:focus{
            border-color:#10b981;
        }
        .search-btn{
            width:48px;
            height:48px;
            padding:0;
            background-color:#10b981;
            color:#ffffff;
            border: 1px solid rgba(160, 255, 210, 0.65);
            border-radius:50%;
            font-size:20px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: transform 150ms cubic-bezier(0, 0, 0.2, 1),
                        background-color 150ms cubic-bezier(0, 0, 0.2, 1),
                        box-shadow 150ms cubic-bezier(0, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.22);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            will-change: transform;
            backface-visibility: hidden;
        }
        .search-btn:hover{
            background-color:#059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(190, 255, 230, 0.75);
        }
        .search-btn:active{
            background-color:#047857;
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(16, 185, 129, 0.18);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 45%);
            border-color: rgba(130, 210, 180, 0.55);
            transition-duration: 80ms;
        }
        .text-link {
            display: inline-block;
            margin-top: 16px;
            color: #10b981;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
            transition: color 150ms cubic-bezier(0, 0, 0.2, 1);
        }
        .text-link:hover {
            color: #34d399;
        }
        /*登录弹窗遮罩*/
        .login-mask{
            position:fixed;
            inset:0;
            background-color:rgba(0,0,0,0.65);
            backdrop-filter:blur(4px);
            z-index:1000;
            display:none;
            align-items:center;
            justify-content:center;
        }
        .login-modal{
            width:100%;
            max-width:420px;
            background:rgba(44,44,46,0.9);
            backdrop-filter:blur(14px);
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);
            padding:32px;
        }
        .login-modal h2{
            color:#fff;
            font-size:22px;
            margin-bottom:24px;
            text-align:center;
        }
        .login-modal input{
            width:100%;
            display:block;
            padding:12px 16px;
            margin-bottom:16px;
            background:#2c2c2e;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:10px;
            color:#ffffff;
            font-size:15px;
            outline:none;
        }
        .login-modal input:focus{
            border-color:#10b981;
        }
        .login-modal input::placeholder{
            color:rgba(255,255,255,0.45);
        }
        .hint-box{
            width:100%;
            padding:10px;
            background-color:rgba(74,222,128,0.12);
            border:1px solid rgba(74,222,128,0.35);
            border-radius:8px;
            color:#4ade80;
            text-align:center;
            font-size:14px;
            margin-bottom:16px;
            display:none;
        }
        .forgot-pwd{
            text-align:right;
            margin:-8px 0 16px 0;
        }
        .forgot-pwd span{
            color:#4ade80;
            font-size:14px;
            cursor:pointer;
            text-decoration:underline;
        }
        .forgot-pwd span:hover{
            color:#86efac;
        }
        .modal-btn-group{
            display:flex;
            gap:12px;
            margin-top:8px;
        }
        .modal-confirm{
            flex:1;
            padding:11px;
            background-color:#10b981;
            color:#fff;
            border:1px solid rgba(160, 255, 210, 0.65);
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
        }
        .modal-cancel{
            flex:1;
            padding:11px;
            background-color:#3a3a3c;
            color:#fff;
            border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;
            cursor:pointer;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="toast" id="toast">该功能暂停使用</div>

    <!--登录弹窗遮罩层-->
    <div class="login-mask" id="loginMask">
        <div class="login-modal">
            <h2>账号登录</h2>
            <input type="text" id="inputUser" placeholder="请输入账号">
            <input type="password" id="inputPwd" placeholder="请输入密码">
            <!--弹窗内提示框，点击忘记密码显示-->
            <div class="hint-box" id="modalHint">??????? + 0104</div>
            <div class="forgot-pwd">
                <span id="forgotPwdBtn">忘记密码？</span>
            </div>
            <div class="modal-btn-group">
                <button class="modal-confirm" id="loginConfirm">登录</button>
                <button class="modal-cancel">取消</button>
            </div>
        </div>
    </div>

    <div class="header-bar">
        <button class="login-btn" id="openLoginBtn">登录</button>
        <button class="logout-btn" id="logoutBtn">登出</button>
        <button class="register-btn" id="registerBtn">注册</button>
    </div>

    <h1 class="page-title">Nanmods的网页解密游戏(测试版)</h1>

    <div class="card">
        <div class="search-wrap">
            <input class="search-input" id="searchInput" type="text" placeholder="请输入搜索内容">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>
        <div class="tip-text">已经被归档的文档仅管理员可查看</div>
        <a class="text-link" href="https://space.bilibili.com/1321022362?spm_id_from=333.1007.0.0" target="_blank">关于作者</a>
    </div>

    <script>
        //管理员账号密码
        const ADMIN_USER = "admin";
        const ADMIN_PWD = "Nanmods0104";
        let isAdminLogin = false;

        const registerBtn = document.getElementById('registerBtn');
        const toast = document.getElementById('toast');
        const openLoginBtn = document.getElementById('openLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const forgotPwdBtn = document.getElementById('forgotPwdBtn');
        const modalHint = document.getElementById('modalHint');

        registerBtn.addEventListener('click', ()=>{
            toast.className = "toast";
            toast.innerText = "该功能暂停使用";
            toast.style.display = 'block';
            setTimeout(()=>{
                toast.style.display = 'none';
            },3000);
        })

        //忘记密码点击：弹窗内部显示线索，不再弹出toast
        forgotPwdBtn.addEventListener('click',()=>{
            modalHint.style.display = "block";
        })

        //登录弹窗逻辑
        const loginMask = document.getElementById('loginMask');
        const cancelBtn = document.querySelector('.modal-cancel');
        const inputUser = document.getElementById('inputUser');
        const inputPwd = document.getElementById('inputPwd');
        const loginConfirm = document.getElementById('loginConfirm');

        openLoginBtn.addEventListener('click',()=>{
            loginMask.style.display = 'flex';
            inputUser.value = "";
            inputPwd.value = "";
            modalHint.style.display = "none"; //打开弹窗时隐藏提示
        })
        cancelBtn.addEventListener('click',()=>{
            loginMask.style.display = 'none';
        })
        loginMask.addEventListener('click',(e)=>{
            if(e.target === loginMask){
                loginMask.style.display = 'none';
            }
        })

        //登录校验
        loginConfirm.addEventListener('click',()=>{
            const u = inputUser.value.trim();
            const p = inputPwd.value.trim();
            if(u === ADMIN_USER && p === ADMIN_PWD){
                isAdminLogin = true;
                loginMask.style.display = 'none';
                openLoginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                toast.className = "toast success";
                toast.innerText = "管理员登录成功，已开放搜索权限";
                toast.style.display = 'block';
                setTimeout(()=>toast.style.display='none',3000);
            }else{
                toast.className = "toast error";
                toast.innerText = "账号或密码错误";
                toast.style.display = 'block';
                setTimeout(()=>toast.style.display='none',3000);
            }
        })

        //登出逻辑
        logoutBtn.addEventListener('click',()=>{
            isAdminLogin = false;
            logoutBtn.style.display = 'none';
            openLoginBtn.style.display = 'block';
            toast.className = "toast";
            toast.innerText = "已退出登录，搜索权限已收回";
            toast.style.display = 'block';
            setTimeout(()=>toast.style.display='none',3000);
        })

        //回车登录
        inputPwd.addEventListener('keydown',e=>{
            if(e.key === 'Enter') loginConfirm.click();
        })

        //搜索逻辑
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        function showNoPermission(){
            toast.className = "toast error";
            toast.innerText = "你无权访问";
            toast.style.display = 'block';
            setTimeout(()=>{
                toast.style.display = 'none';
            },3000);
        }
        function searchAction(){
            if(isAdminLogin){
                toast.className = "toast success";
                toast.innerText = "搜索功能已执行";
                toast.style.display = 'block';
                setTimeout(()=>toast.style.display='none',3000);
            }else{
                showNoPermission();
            }
        }
        searchBtn.addEventListener('click', searchAction);
        searchInput.addEventListener('keydown',(e)=>{
            if(e.key === 'Enter') searchAction();
        })
    </script>
</body>
</html>
