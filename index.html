<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看到你了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, system-ui, sans-serif;
        }
        body {
            background-color: #2d0000;
            background-image: radial-gradient(circle at 50% 30%, #4a0000 0%, #2d0000 60%, #1a0000 100%);
            color: #e5e5e5;
            min-height: 100vh;
            padding: 24px;
        }
        .header-bar {
            display: flex;
            justify-content: flex-start;
            gap:12px;
            margin-bottom:40px;
        }
        .top-btn {
            padding:8px 16px;
            border-radius:999px;
            border:1px solid #ff3333;
            background:#990000;
            color:white;
            cursor:pointer;
            transition: all 0.25s ease;
        }
        .top-btn:hover {
            background:#b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 0 12px #ff333380;
        }
        .container-card {
            max-width: 720px;
            margin:0 auto;
            background:rgba(30,0,0,0.85);
            backdrop-filter: blur(8px);
            padding:48px 36px;
            border-radius:16px;
            border:1px solid #5a0000;
            box-shadow: 0 8px 30px #00000070;
        }
        h1 {
            text-align:center;
            margin-bottom:32px;
            font-size:28px;
            color:#ff2222;
            text-shadow: 0 0 16px #ff000080;
        }
        .tip-text {
            margin-top:14px;
            font-size:14px;
            color:#b08080;
            text-align:center;
        }
        .doc-list {
            display:none;
            margin-top:24px;
            flex-direction:column;
            gap:14px;
        }
        .doc-card {
            background:rgba(40,0,0,0.7);
            border:1px solid #5a0000;
            border-radius:12px;
            padding:20px 24px;
            cursor:pointer;
            transition: all 0.25s ease;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .doc-card:hover {
            border-color:#ff3333;
            box-shadow: 0 0 16px #ff000040;
            transform: translateY(-2px);
        }
        .doc-left {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .pin-tag {
            background:#dc2626;
            color:#fff;
            font-size:12px;
            padding:3px 8px;
            border-radius:6px;
            font-weight:600;
        }
        .doc-name {
            font-size:18px;
            font-weight:600;
            color:#fff;
        }
        .doc-meta {
            font-size:13px;
            color:#b08080;
        }
        .modal-mask {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box {
            background:#2a0000;
            padding:32px;
            border-radius:14px;
            width:min(360px,90vw);
            border:1px solid #5a0000;
        }
        .modal-box h3 {
            margin-bottom:20px;
            text-align:center;
            color:#fff;
        }
        .modal-input {
            width:100%;
            padding:12px 16px;
            border-radius:10px;
            border:1px solid #5a0000;
            background:#1a0000;
            color:#fff;
            font-size:15px;
            margin-bottom:14px;
            outline:none;
        }
        .modal-input:focus {
            border-color:#ff3333;
            box-shadow:0 0 10px #ff000060;
        }
        .modal-btn-group {
            display:flex;
            gap:10px;
            margin-top:16px;
        }
        .modal-btn {
            flex:1;
            padding:11px;
            border-radius:10px;
            border:none;
            cursor:pointer;
        }
        .btn-primary {
            background:#990000;
            color:white;
        }
        .btn-primary:hover{
            background:#b91c1c;
        }
        .btn-cancel {
            background:#3a0000;
            color:#ffaaaa;
        }
        .forgot-pwd {
            text-align:center;
            margin:10px 0;
            color:#ff6666;
            cursor:pointer;
            font-size:14px;
        }
        .hint-box {
            padding:10px;
            background:#1a0000;
            border-radius:8px;
            text-align:center;
            color:#fbbf24;
            margin:12px 0;
            display:none;
        }
        .toast {
            position:fixed;
            bottom:30px;
            left:50%;
            transform:translateX(-50%);
            background:#2a0000;
            color:#fff;
            padding:12px 22px;
            border-radius:10px;
            border:1px solid #5a0000;
            display:none;
            z-index:1000;
        }
        .power-warning {
            position:fixed;
            inset:0;
            background:rgba(20,0,0,0.95);
            z-index:2000;
            display:none;
            align-items:center;
            justify-content:center;
            flex-direction:column;
        }
        .power-warning .pw-text {
            color:#ff2222;
            font-size:34px;
            font-weight:700;
            text-shadow:0 0 20px #ff000080;
        }
        .power-warning .pw-sub {
            color:#b08080;
            font-size:15px;
            margin-top:14px;
        }
        /* 文档详情弹窗 */
        .doc-detail-mask {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1500;
        }
        .doc-detail-box {
            background:#2a0000;
            padding:36px;
            border-radius:14px;
            width:min(420px,90vw);
            border:1px solid #5a0000;
            text-align:center;
        }
        .doc-detail-box .dd-title {
            color:#ff2222;
            font-size:26px;
            font-weight:700;
            text-shadow:0 0 12px #ff000060;
        }
        .doc-detail-box .dd-desc {
            color:#b08080;
            font-size:15px;
            margin-top:16px;
        }
        .dd-close {
            margin-top:24px;
            padding:10px 32px;
            border-radius:10px;
            border:none;
            background:#990000;
            color:#fff;
            cursor:pointer;
            transition: all 0.25s ease;
        }
        .dd-close:hover {
            background:#b91c1c;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <button class="top-btn" id="verifyBtn">验证身份</button>
    </div>

    <div class="container-card">
        <h1>看到你了</h1>
        <div class="tip-text">已经被归档的文档仅管理员可查看</div>

        <div class="doc-list" id="docList">
            <div class="doc-card" onclick="openDocDetail('Test001')">
                <div class="doc-left">
                    <span class="pin-tag">置顶</span>
                    <span class="doc-name">Test001</span>
                </div>
                <div class="doc-meta">已归档文档</div>
            </div>
            <div class="doc-card" onclick="openDocDetail('Test002')">
                <div class="doc-left">
                    <span class="doc-name">Test002</span>
                </div>
                <div class="doc-meta">已归档文档</div>
            </div>
        </div>
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal-box">
            <h3>验证身份</h3>
            <input class="modal-input" id="pwdInput" type="password" placeholder="请输入管理员密码">
            <div class="forgot-pwd" id="forgotBtn">忘记密码？</div>
            <div class="hint-box" id="pwdHint">逃避不能解决问题</div>
            <div class="modal-btn-group">
                <button class="modal-btn btn-primary" id="confirmBtn">确认</button>
                <button class="modal-btn btn-cancel" id="uselessBtn">你无处可逃</button>
            </div>
        </div>
    </div>

    <!-- 文档详情弹窗 -->
    <div class="doc-detail-mask" id="docDetailMask">
        <div class="doc-detail-box">
            <div class="dd-title" id="ddTitle">Test001</div>
            <div class="dd-desc">Coming soon</div>
            <button class="dd-close" id="ddClose">关闭</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="power-warning" id="powerWarning">
        <div class="pw-text">你已被剥夺力量</div>
        <div class="pw-sub">不要试图窥探</div>
    </div>

    <script>
        const powerWarning = document.getElementById('powerWarning');
        function deprivePower(){
            powerWarning.style.display = "flex";
            setTimeout(()=> powerWarning.style.display = "none", 1600);
        }

        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            deprivePower();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'F12') {
                e.preventDefault();
                deprivePower();
            }
        });

        const verifyBtn = document.getElementById('verifyBtn');
        const modalMask = document.getElementById('modalMask');
        const pwdInput = document.getElementById('pwdInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const uselessBtn = document.getElementById('uselessBtn');
        const forgotBtn = document.getElementById('forgotBtn');
        const pwdHint = document.getElementById('pwdHint');
        const toast = document.getElementById('toast');
        const docList = document.getElementById('docList');
        const docDetailMask = document.getElementById('docDetailMask');
        const ddTitle = document.getElementById('ddTitle');
        const ddClose = document.getElementById('ddClose');

        let isAdmin = false;
        const adminPwd = "Youarenext";

        function showToast(msg){
            toast.innerText = msg;
            toast.style.display = "block";
            setTimeout(()=> toast.style.display="none",2200);
        }

        // 打开文档详情
        function openDocDetail(name){
            ddTitle.innerText = name;
            docDetailMask.style.display = "flex";
        }
        ddClose.onclick = ()=>{
            docDetailMask.style.display = "none";
        }
        docDetailMask.onclick = (e)=>{
            if(e.target === docDetailMask) docDetailMask.style.display = "none";
        }

        verifyBtn.onclick = ()=>{
            modalMask.style.display = "flex";
            pwdInput.value = "";
            pwdHint.style.display = "none";
        }
        forgotBtn.onclick = ()=>{
            pwdHint.style.display = "block";
        }
        confirmBtn.onclick = ()=>{
            if(pwdInput.value === adminPwd){
                isAdmin = true;
                modalMask.style.display = "none";
                verifyBtn.style.display = "none";
                docList.style.display = "flex";
                showToast("身份验证成功");
            }else{
                showToast("密码错误");
            }
        }
    </script>
</body>
</html>
